- id: acme-r-001
  kind: tone
  statement: Write to small companies in short, friendly emails, use first names, stop after five sentences,
    and move to a call if more is needed.
  scope:
    channel: external
    segments:
    - smb
    personas: []
  provenance:
  - interview_id: acme-i-1
    quote: So with small companies we keep emails short and friendly. We use first names, and we stop
      after five sentences. If it needs more than that, it should be a call.
    start: 234
    end: 395
  product_ids: []
  status: proposed
- id: acme-r-002
  kind: tone
  statement: Write a more formal email to mid-sized firms.
  scope:
    channel: external
    segments:
    - mid-market
    personas: []
  provenance:
  - interview_id: acme-i-1
    quote: 'Head of sales: Mid-sized firms get a more formal email, but honestly the bigger rule is about
      money.'
    start: 436
    end: 536
  product_ids: []
  status: proposed
- id: acme-r-003
  kind: claim
  statement: Never put a discount in writing in an email to a customer; discuss discounts by phone with
    the account owner so they appear in the order form.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-1
    quote: We never put a discount in writing in an email to a customer. Discounts are discussed on the
      phone, with the account owner, and then they show up in the order form. An email gets forwarded
      to finance and suddenly the discount is the new price.
    start: 537
    end: 780
  product_ids: []
  status: proposed
- id: acme-r-004
  kind: claim
  statement: When mentioning a price, quote the list price from the catalog exactly, with no rounding
    or approximations.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-1
    quote: 'Head of sales: When we mention a price, we always quote the list price from the catalog, exactly
      as it is. No rounding, no "around five hundred". Starter is 490 euros, Pro is 1490, and that is
      what the email says.'
    start: 826
    end: 1039
  - interview_id: acme-i-3
    quote: 'Customer success lead: Rarely, but when we do, we use the catalog list price. Same rule as
      sales: the price in the email is the price in the catalog, word for word.'
    start: 1044
    end: 1208
  product_ids:
  - acme-p-1
  - acme-p-2
  status: proposed
- id: acme-r-005
  kind: practice
  statement: For bundle requests, have the account manager build a quote and have the email only point
    to it.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-1
    quote: If someone wants a bundle, the account manager builds a quote, the email just points to it.
    start: 1040
    end: 1131
  product_ids: []
  status: proposed
- id: acme-r-006
  kind: claim
  statement: Tell customers that Starter and Pro setup takes one day.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-1
    quote: For Starter and Pro we can say setup in one day, because it is true and we track it.
    start: 1268
    end: 1352
  product_ids:
  - acme-p-1
  - acme-p-2
  claim_text: Setup for Starter and Pro takes one day.
  status: proposed
- id: acme-r-007
  kind: claim
  statement: Do not promise anything about Enterprise timelines by email, because they depend on single
    sign-on and the customer's IT team.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-1
    quote: We do not promise anything about Enterprise timelines by email, that depends on single sign-on
      and their IT team.
    start: 1353
    end: 1466
  product_ids:
  - acme-p-3
  status: proposed
- id: acme-r-008
  kind: tone
  statement: Write one idea per email, with one clear next step and a date for the call, and do not over-explain
    to busy buyers.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-1
    quote: 'Head of sales: They over-explain. Our buyers are busy. One idea per email, one clear next
      step, a date for the call.'
    start: 1522
    end: 1638
  product_ids: []
  status: proposed
- id: acme-r-009
  kind: practice
  statement: Check the CRM before writing so you do not ask questions the team already knows the answer
    to.
  scope:
    channel: internal
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-1
    quote: And they forget to check the CRM before writing, so they ask questions we already know the
      answer to.
    start: 1639
    end: 1740
  - interview_id: acme-i-2
    quote: 'Account manager: Read the last three emails in the thread before you write. Half the mistakes
      I see are people answering a question that was already answered, or contradicting what a colleague
      promised last month.'
    start: 1949
    end: 2162
  product_ids: []
  status: proposed
- id: acme-r-010
  kind: practice
  statement: 'Put accuracy before tone: a friendly email with a wrong price costs more than a stiff email
    with the right one.'
  scope:
    channel: any
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-1
    quote: 'Head of sales: Just that tone matters less than accuracy. A friendly email with a wrong price
      costs us more than a stiff email with the right one.'
    start: 2113
    end: 2259
  product_ids: []
  status: proposed
- id: acme-r-011
  kind: practice
  statement: Reply to every customer email within one business day, even if the reply is only a holding
    message saying you are checking and will come back.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-2
    quote: I reply to every customer email within one business day, even if the answer is "I am checking
      and will come back on Thursday".
    start: 216
    end: 342
  product_ids: []
  status: proposed
- id: acme-r-012
  kind: tone
  statement: When writing to the economic buyer who signs the contract, lead with cost of ownership and
    the time their team saves rather than with features.
  scope:
    channel: external
    segments: []
    personas:
    - economic-buyer
  provenance:
  - interview_id: acme-i-2
    quote: When I write to the person who signs the contract, the economic buyer, I lead with cost of
      ownership and the time their team saves, not with features.
    start: 462
    end: 612
  - interview_id: acme-i-2
    quote: They care that the report that took two days now takes an hour.
    start: 654
    end: 717
  product_ids: []
  status: proposed
- id: acme-r-013
  kind: claim
  statement: For mid-sized customers who renew for two years, put the ten percent renewal discount directly
    in the renewal email.
  scope:
    channel: external
    segments:
    - mid-market
    personas: []
  provenance:
  - interview_id: acme-i-2
    quote: For mid-sized customers, I put a ten percent renewal discount directly in the renewal email
      when they renew for two years.
    start: 812
    end: 934
  product_ids: []
  status: proposed
- id: acme-r-014
  kind: claim
  statement: Tell Pro customers that single sign-on is included.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-2
    quote: I always tell Pro customers that single sign-on is included, because that is the first question
      their IT team asks.
    start: 1196
    end: 1311
  product_ids:
  - acme-p-2
  claim_text: Single sign-on is included in Insight Pro.
  status: proposed
- id: acme-r-015
  kind: tone
  statement: 'When writing about bad news such as an outage, be plain and early: say what happened, what
    it affected and when the next update comes, using no marketing words.'
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-2
    quote: 'Account manager: Plain and early. Say what happened, what it affected, and when the next update
      comes. No marketing words, no "we are thrilled".'
    start: 1393
    end: 1537
  product_ids: []
  status: proposed
- id: acme-r-016
  kind: tone
  statement: Never blame the customer's setup in writing, even when the problem is their setup.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-2
    quote: And I never blame the customer's setup in writing, even when it is their setup.
    start: 1538
    end: 1617
  product_ids: []
  status: proposed
- id: acme-r-017
  kind: practice
  statement: Log every promise made to a customer in the CRM on the same day, so the next person on the
    account knows what was promised.
  scope:
    channel: internal
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-2
    quote: 'Account manager: I log every promise I make in the CRM on the same day. If I told someone
      they get two training sessions, it goes in the notes, because the next person on the account needs
      to know what was promised.'
    start: 1660
    end: 1875
  - interview_id: acme-i-3
    quote: 'Customer success lead: Write down what they promised.'
    start: 1934
    end: 1987
  - interview_id: acme-i-3
    quote: If it is not in the CRM, I cannot honor it.
    start: 2055
    end: 2098
  product_ids: []
  status: proposed
- id: acme-r-018
  kind: tone
  statement: Write internal messages to colleagues as bullet points with no greetings and no sign-off,
    stating only what happened, what is needed and by when, and turn any message long enough to need scrolling
    into a ticket.
  scope:
    channel: internal
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-3
    quote: Between colleagues, internally, we write bullet points and skip the formalities. No greetings,
      no sign-off, just what happened, what we need and by when. If a message to a colleague needs scrolling,
      it should have been a ticket.
    start: 135
    end: 363
  product_ids: []
  status: proposed
- id: acme-r-019
  kind: claim
  statement: Never promise dates for roadmap features in customer emails; say only "it is on the roadmap"
    or nothing.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-3
    quote: 'The big one: we never promise dates for features on the roadmap.'
    start: 449
    end: 513
  - interview_id: acme-i-3
    quote: We say "it is on the roadmap" or nothing.
    start: 622
    end: 663
  product_ids: []
  status: proposed
- id: acme-r-020
  kind: tone
  statement: 'Write precisely to technical evaluators: link the exact API documentation page, give real
    field names, avoid vague reassurances like "it should work", and say you are checking when you are
    not sure.'
  scope:
    channel: external
    segments: []
    personas:
    - technical-evaluator
  provenance:
  - interview_id: acme-i-3
    quote: Technical evaluators, the people testing the integration, want precision. With them we link
      the exact page of the API documentation and give real field names. No hand-waving, no "it should
      work". If we are not sure, we say we are checking.
    start: 746
    end: 985
  product_ids: []
  status: proposed
- id: acme-r-021
  kind: practice
  statement: When a customer asks about a discount, hand the conversation over to their account owner.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-3
    quote: If a customer asks about a discount, I hand over to their account owner.
    start: 1209
    end: 1281
  product_ids: []
  status: proposed
- id: acme-r-022
  kind: claim
  statement: Use the onboarding templates, and in the welcome email say only that the Onboarding Pack
    includes two training sessions, never promising unlimited training.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-3
    quote: 'Customer success lead: We reuse a few templates for onboarding. The Onboarding Pack includes
      two training sessions, and our welcome email says exactly that, nothing more. People used to promise
      unlimited training to be nice, and then we could not deliver.'
    start: 1348
    end: 1603
  product_ids:
  - acme-p-4
  claim_text: The Onboarding Pack includes two training sessions
  status: proposed
- id: acme-r-023
  kind: tone
  statement: Write to customers in plain language without jargon, as if explaining to a smart colleague
    from another department, using short sentences and active voice.
  scope:
    channel: external
    segments: []
    personas: []
  provenance:
  - interview_id: acme-i-3
    quote: 'Customer success lead: Our customers are mostly small and mid-sized firms, so we avoid jargon.
      Write like you would explain it to a smart colleague from another department. Short sentences, active
      voice.'
    start: 1675
    end: 1878
  product_ids: []
  status: proposed
