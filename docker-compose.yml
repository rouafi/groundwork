services:
  api:
    build: .
    command: uvicorn groundwork.entrypoints.api:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]  # no auth: never publish on the LAN
    env_file: [.env]
    environment:
      GROUNDWORK_PACK: ${GROUNDWORK_PACK:-acme}
    volumes:
      - "./client_packs:/app/client_packs:ro"
      - "./domains:/app/domains:ro"
      - "./traces:/app/traces"  # a run writes its trace here
      - "var:/app/var"  # sent emails and the approval queue

  mcp:
    build: .
    command: groundwork mcp-serve --pack ${GROUNDWORK_PACK:-acme} --transport streamable-http
    ports: ["127.0.0.1:8001:8001"]  # no auth: never publish on the LAN
    env_file: [.env]
    volumes:
      - "./client_packs:/app/client_packs:ro"
      - "./domains:/app/domains:ro"
      - "./traces:/app/traces:ro"

  cli:
    build: .
    profiles: [tools]
    entrypoint: ["groundwork"]
    env_file: [.env]
    volumes:
      - "./client_packs:/app/client_packs:ro"
      - "./domains:/app/domains:ro"
      - "./traces:/app/traces"
      - "var:/app/var"  # the same queue as the api service: docker compose run cli approvals list ...

volumes:
  var:
