<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" width="1000" height="672" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Layers: core, domain packs, client packs</title>
  <!-- Card background so the diagram reads in light and dark mode -->
  <rect x="0" y="0" width="1000" height="672" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#1A2230">One core, reusable domain packs, client packs as data</text>

  <!-- Surfaces: the client's own front, outside the kit -->
  <text x="40" y="84" font-size="17" font-weight="700" fill="#374151">Surfaces</text>
  <text x="40" y="104" font-size="13" fill="#4B5563">The client's own front</text>
  <rect x="260" y="64" width="700" height="52" rx="12" fill="#FFFFFF" stroke="#8A93A0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="610" y="86" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">Any front the client already uses</text>
  <text x="610" y="105" font-size="13" fill="#4B5563" text-anchor="middle">Claude Desktop, CRM, Slack, internal tools. Not part of the kit.</text>
  <line x1="610" y1="118" x2="610" y2="150" stroke="#8A93A0" stroke-width="2"/>
  <path d="M604 144 L610 154 L616 144 Z" fill="#8A93A0"/>
  <text x="630" y="140" font-size="13" fill="#4B5563">Headless entrypoints: CLI, HTTP API, MCP server</text>

  <g transform="translate(0,92)">
  <!-- Vertical domain columns -->
  <rect x="260" y="80" width="220" height="312" rx="14" fill="#E3F1ED"/>
  <rect x="500" y="80" width="220" height="312" rx="14" fill="#F3F4F6"/>
  <rect x="740" y="80" width="220" height="312" rx="14" fill="#F3F4F6"/>

  <!-- Horizontal client rows, drawn across the columns -->
  <rect x="252" y="94" width="716" height="76" rx="10" fill="#B7791F" fill-opacity="0.10"/>
  <rect x="252" y="178" width="716" height="76" rx="10" fill="#B7791F" fill-opacity="0.10"/>

  <!-- Left labels -->
  <text x="40" y="112" font-size="17" font-weight="700" fill="#8A5A12">Client packs</text>
  <text x="40" y="134" font-size="13" fill="#4B5563">One row per client</text>
  <text x="40" y="152" font-size="13" fill="#4B5563">Data and config only</text>
  <text x="238" y="138" font-size="14" font-weight="600" fill="#8A5A12" text-anchor="end">Acme</text>
  <text x="238" y="222" font-size="14" font-weight="600" fill="#8A5A12" text-anchor="end">Beta</text>

  <text x="40" y="318" font-size="17" font-weight="700" fill="#22665A">Domain packs</text>
  <text x="40" y="340" font-size="13" fill="#4B5563">One column per domain</text>
  <text x="40" y="358" font-size="13" fill="#4B5563">Schema, skills, evals</text>

  <text x="40" y="452" font-size="17" font-weight="700" fill="#1F3A5F">Core</text>
  <text x="40" y="474" font-size="13" fill="#4B5563">Shared code, every client</text>

  <!-- Client cells: Acme -->
  <rect x="272" y="102" width="196" height="60" rx="8" fill="#FBF1DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="370" y="128" font-size="15" font-weight="700" fill="#5C3D0C" text-anchor="middle">Acme in comms</text>
  <text x="370" y="148" font-size="12.5" fill="#5C3D0C" text-anchor="middle">rules, interviews, golden set</text>

  <rect x="512" y="102" width="196" height="60" rx="8" fill="none" stroke="#A8B0BC" stroke-dasharray="5 4"/>
  <text x="610" y="137" font-size="13" fill="#8A93A0" text-anchor="middle">not yet</text>
  <rect x="752" y="102" width="196" height="60" rx="8" fill="none" stroke="#A8B0BC" stroke-dasharray="5 4"/>
  <text x="850" y="137" font-size="13" fill="#8A93A0" text-anchor="middle">not yet</text>

  <!-- Client cells: Beta -->
  <rect x="272" y="186" width="196" height="60" rx="8" fill="#FBF1DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="370" y="212" font-size="15" font-weight="700" fill="#5C3D0C" text-anchor="middle">Beta in comms</text>
  <text x="370" y="232" font-size="12.5" fill="#5C3D0C" text-anchor="middle">own tone and thresholds</text>

  <rect x="512" y="186" width="196" height="60" rx="8" fill="none" stroke="#A8B0BC" stroke-dasharray="5 4"/>
  <text x="610" y="221" font-size="13" fill="#8A93A0" text-anchor="middle">not yet</text>
  <rect x="752" y="186" width="196" height="60" rx="8" fill="none" stroke="#A8B0BC" stroke-dasharray="5 4"/>
  <text x="850" y="221" font-size="13" fill="#8A93A0" text-anchor="middle">not yet</text>

  <!-- Domain pack boxes -->
  <rect x="272" y="276" width="196" height="102" rx="10" fill="#FFFFFF" stroke="#2F7D6D" stroke-width="2"/>
  <text x="370" y="306" font-size="16" font-weight="700" fill="#22665A" text-anchor="middle">Comms</text>
  <text x="370" y="330" font-size="12.5" fill="#22665A" text-anchor="middle">ontology schema</text>
  <text x="370" y="348" font-size="12.5" fill="#22665A" text-anchor="middle">skills and prompts</text>
  <text x="370" y="366" font-size="12.5" fill="#22665A" text-anchor="middle">eval scorers</text>

  <rect x="512" y="276" width="196" height="102" rx="10" fill="#FFFFFF" stroke="#A8B0BC" stroke-dasharray="5 4"/>
  <text x="610" y="320" font-size="16" font-weight="700" fill="#6B7380" text-anchor="middle">Support</text>
  <text x="610" y="342" font-size="12.5" fill="#8A93A0" text-anchor="middle">roadmap</text>

  <rect x="752" y="276" width="196" height="102" rx="10" fill="#FFFFFF" stroke="#A8B0BC" stroke-dasharray="5 4"/>
  <text x="850" y="320" font-size="16" font-weight="700" fill="#6B7380" text-anchor="middle">Finance</text>
  <text x="850" y="342" font-size="12.5" fill="#8A93A0" text-anchor="middle">roadmap</text>

  <!-- Core -->
  <rect x="260" y="412" width="700" height="92" rx="14" fill="#1F3A5F"/>
  <text x="610" y="446" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Core, shared by every client</text>
  <text x="610" y="470" font-size="13.5" fill="#D6E2F0" text-anchor="middle">Ontology engine, MCP context server, agent harness</text>
  <text x="610" y="490" font-size="13.5" fill="#D6E2F0" text-anchor="middle">Vector search, evals, tracing</text>

  </g>

  <!-- Footer rule -->
  <text x="40" y="640" font-size="14" fill="#374151">Client overrides domain, domain overrides core, through config only. Every client pack is schema-validated in CI.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
