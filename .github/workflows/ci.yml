name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Lint, types, architecture, tests
        run: make check
      - name: Demo smoke test (replay, no API key)
        run: make demo
